services:
  postgres:
    image: postgres:16-alpine
    container_name: Miane-postgres
    environment:
      - POSTGRES_DB=Miane_identity
      - POSTGRES_USER=Miane
      - POSTGRES_PASSWORD=Miane_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - Miane-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Miane -d Miane_identity"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: Miane-redis
    ports:
      - "6370:6379"
    networks:
      - Miane-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  identity-api:
    build:
      context: .
      dockerfile: src/Services/Identity/Identity.API/Dockerfile
    container_name: Miane-identity-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5127
      - ConnectionStrings__DefaultConnection=${IDENTITY_DB_CONNECTION_STRING:-Host=postgres;Port=5432;Database=Miane_identity;Username=Miane;Password=Miane_password}
      - Jwt__Key=${JWT_SIGNING_KEY:-Miane_Development_Jwt_Signing_Key_Change_In_Production_2026!@#}
      - Jwt__Issuer=MianeIdentityService
      - Jwt__Audience=MianeClients
      - Redis__ConnectionString=redis:6379
      - Smtp__Host=${SMTP_HOST:-smtp.gmail.com}
      - Smtp__Port=${SMTP_PORT:-587}
      - Smtp__Username=${SMTP_USERNAME:-}
      - Smtp__Password=${SMTP_PASSWORD:-}
      - Smtp__FromEmail=${SMTP_FROM_EMAIL:-}
      - Smtp__FromName=${SMTP_FROM_NAME:-MIANE}
      - Google__ClientId=${GOOGLE_CLIENT_ID:-135347207127-oido4n87prcqp44lvjtiovfqafr5qkbe.apps.googleusercontent.com}
      - Google__BypassValidation=${GOOGLE_BYPASS_VALIDATION:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5127:5127"
    networks:
      - Miane-network

  trip-api:
    build:
      context: .
      dockerfile: src/Services/Trip/Trip.API/Dockerfile
    container_name: Miane-trip-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5128
      - ConnectionStrings__DefaultConnection=${TRIP_DB_CONNECTION_STRING:-Host=postgres;Port=5432;Database=Miane_trip;Username=Miane;Password=Miane_password}
      - Redis__ConnectionString=redis:6379
      - Jwt__Key=${JWT_SIGNING_KEY:-Miane_Development_Jwt_Signing_Key_Change_In_Production_2026!@#}
      - Jwt__Issuer=MianeIdentityService
      - Jwt__Audience=MianeClients
      - Services__Notification__BaseUrl=http://notification-api:5130/
      - Services__Notification__ApiKey=${INTERNAL_API_KEY:-Miane_Dev_Internal_Api_Key_Change_Me}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      notification-api:
        condition: service_started
    ports:
      - "5128:5128"
    volumes:
      - trip_uploads:/app/uploads
    networks:
      - Miane-network

  expense-api:
    build:
      context: .
      dockerfile: src/Services/Expense/Expense.API/Dockerfile
    container_name: Miane-expense-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5129
      - ConnectionStrings__DefaultConnection=${EXPENSE_DB_CONNECTION_STRING:-Host=postgres;Port=5432;Database=Miane_expense;Username=Miane;Password=Miane_password}
      - Redis__ConnectionString=redis:6379
      - AiServices__BaseUrl=${AI_SERVICE_URL:-http://localhost:8000}
      - AiServices__ApiKey=${AI_SERVICE_API_KEY:-}
      - VietQr__BaseUrl=${VIETQR_BASE_URL:-https://api.vietqr.io/}
      - VietQr__ClientId=${VIETQR_CLIENT_ID:-}
      - VietQr__ApiKey=${VIETQR_API_KEY:-}
      - Jwt__Key=${JWT_SIGNING_KEY:-Miane_Development_Jwt_Signing_Key_Change_In_Production_2026!@#}
      - Jwt__Issuer=MianeIdentityService
      - Jwt__Audience=MianeClients
      - Services__Trip__BaseUrl=http://trip-api:5128/
      - Services__Notification__BaseUrl=http://notification-api:5130/
      - Services__Notification__ApiKey=${INTERNAL_API_KEY:-Miane_Dev_Internal_Api_Key_Change_Me}
      - ExchangeRates__AllowStatic=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      trip-api:
        condition: service_started
      notification-api:
        condition: service_started
    ports:
      - "5129:5129"
    volumes:
      - expense_data_protection_keys:/root/.aspnet/DataProtection-Keys
    networks:
      - Miane-network

  notification-api:
    build:
      context: .
      dockerfile: src/Services/Notification/Notification.API/Dockerfile
    container_name: Miane-notification-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5130
      - ConnectionStrings__DefaultConnection=${NOTIFICATION_DB_CONNECTION_STRING:-Host=postgres;Port=5432;Database=Miane_notification;Username=Miane;Password=Miane_password}
      - Jwt__Key=${JWT_SIGNING_KEY:-Miane_Development_Jwt_Signing_Key_Change_In_Production_2026!@#}
      - Jwt__Issuer=MianeIdentityService
      - Jwt__Audience=MianeClients
      - Internal__ApiKey=${INTERNAL_API_KEY:-Miane_Dev_Internal_Api_Key_Change_Me}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5130:5130"
    networks:
      - Miane-network

  web-gateway:
    build:
      context: .
      dockerfile: src/ApiGateways/Web.Gateway/Dockerfile
    container_name: Miane-web-gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - Jwt__Key=${JWT_SIGNING_KEY:-Miane_Development_Jwt_Signing_Key_Change_In_Production_2026!@#}
      - Jwt__Issuer=MianeIdentityService
      - Jwt__Audience=MianeClients
    ports:
      - "8080:8080"
    depends_on:
      - identity-api
      - trip-api
      - expense-api
      - notification-api
    networks:
      - Miane-network

  mobile-client:
    build:
      context: ./src/Clients/mobile
      dockerfile: Dockerfile
      args:
        - API_URL=${MOBILE_API_URL:-http://localhost:8080}
        - MIANE_AI_IMAGE_URL=${MIANE_AI_IMAGE_URL:-http://localhost:8000/api/v1/image/generate-trip-thumbnail}
    container_name: Miane-mobile-client
    ports:
      - "3000:80"
    depends_on:
      - web-gateway
    networks:
      - Miane-network

  ai-image:
    build:
      context: ./services/ai-image
      dockerfile: Dockerfile
    container_name: Miane-ai-image
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_IMAGE_MODEL=${OPENAI_IMAGE_MODEL:-gpt-image-1.5}
      - OPENAI_IMAGE_SIZE=${OPENAI_IMAGE_SIZE:-1536x1024}
      - OPENAI_IMAGE_QUALITY=${OPENAI_IMAGE_QUALITY:-medium}
      - OPENAI_IMAGE_FORMAT=${OPENAI_IMAGE_FORMAT:-jpeg}
      - AI_IMAGE_PUBLIC_BASE_URL=${AI_IMAGE_PUBLIC_BASE_URL:-http://localhost:8000}
      - AI_IMAGE_CACHE_DIR=${AI_IMAGE_CACHE_DIR:-/app/cache}
      - AI_IMAGE_USE_OLLAMA=${AI_IMAGE_USE_OLLAMA:-false}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://localhost:11434}
      - AI_IMAGE_LANDMARK_MODEL=${AI_IMAGE_LANDMARK_MODEL:-llama3.2:3b}
    ports:
      - "8000:8000"
    volumes:
      - ai_image_cache:/app/cache
    networks:
      - Miane-network

volumes:
  postgres_data:
  ai_image_cache:
  expense_data_protection_keys:
  trip_uploads:

networks:
  Miane-network:
    driver: bridge
